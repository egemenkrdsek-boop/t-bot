name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # Actions are pinned to immutable commit SHAs (release tags in comments).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version do not match.' }
      - run: npm ci
      - name: Dependency audit (high and above)
        shell: bash
        run: |
          set +e
          output=$(npm audit --audit-level=high 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then exit 0; fi
          if printf '%s' "$output" | grep -qiE 'ENOTFOUND|ECONNREFUSED|ECONNRESET|ETIMEDOUT|EAI_AGAIN|network|registry.*(unavailable|failed|error)'; then
            echo "::warning::npm audit could not reach the registry; dependency audit skipped for this run."
            exit 0
          fi
          exit "$status"
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
      - name: Create checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = "release/T-Bot-Setup-$version.exe"
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  T-Bot-Setup-$version.exe" | Set-Content -Encoding ascii "release/SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-setup
          path: |
            release/T-Bot-Setup-*.exe
            release/SHA256SUMS.txt
            release/build-manifest.json
          if-no-files-found: error
      - name: Publish versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $existing = gh release view "$env:GITHUB_REF_NAME" --json assets,isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (($existing | ConvertFrom-Json).isDraft) { throw 'Existing release is a draft; inspect and publish it explicitly.' }
            $assetNames = @((($existing | ConvertFrom-Json).assets) | ForEach-Object { $_.name })
            if (($assetNames -contains "T-Bot-Setup-$version.exe") -and ($assetNames -contains 'SHA256SUMS.txt') -and ($assetNames -contains 'build-manifest.json')) {
              Write-Host 'Versioned release already contains its installer and checksum; preserving published assets.'
              exit 0
            }
            throw 'Existing release is incomplete. Inspect and repair its assets explicitly before retrying.'
          }
          gh release create "$env:GITHUB_REF_NAME" "release/T-Bot-Setup-$version.exe" "release/SHA256SUMS.txt" "release/build-manifest.json" --verify-tag --title "T Bot $version" --notes "Windows x64 installer. This build is unsigned. See README and docs/verification.md for setup requirements and verification limits."
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
