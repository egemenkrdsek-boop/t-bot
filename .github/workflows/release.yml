name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version do not match.' }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
      - name: Create checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = "release/T-Bot-Setup-$version.exe"
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  T-Bot-Setup-$version.exe" | Set-Content -Encoding ascii "release/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            release/T-Bot-Setup-*.exe
            release/SHA256SUMS.txt
            release/build-manifest.json
          if-no-files-found: error
      - name: Publish versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $existing = gh release view "$env:GITHUB_REF_NAME" --json assets,isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (($existing | ConvertFrom-Json).isDraft) { throw 'Existing release is a draft; inspect and publish it explicitly.' }
            $assetNames = @((($existing | ConvertFrom-Json).assets) | ForEach-Object { $_.name })
            if (($assetNames -contains "T-Bot-Setup-$version.exe") -and ($assetNames -contains 'SHA256SUMS.txt') -and ($assetNames -contains 'build-manifest.json')) {
              Write-Host 'Versioned release already contains its installer and checksum; preserving published assets.'
              exit 0
            }
            throw 'Existing release is incomplete. Inspect and repair its assets explicitly before retrying.'
          }
          gh release create "$env:GITHUB_REF_NAME" "release/T-Bot-Setup-$version.exe" "release/SHA256SUMS.txt" "release/build-manifest.json" --verify-tag --title "T Bot $version" --notes "Windows x64 installer. This build is unsigned. See README and docs/verification.md for setup requirements and verification limits."
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
